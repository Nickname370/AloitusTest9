    <title>Sähköiskuposti</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f6f9;
            display: flex;
            height: 100vh;
        }

        /* =========================
           SIVUPALKKI
        ========================= */

        .sidebar {
            width: 250px;
            background-color: #2c3e50;
            color: white;
            padding: 20px;
        }

        .sidebar h2 {
            margin-top: 0;
            font-size: 20px;
        }

        .sidebar button {
            width: 100%;
            padding: 10px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .sidebar button:hover {
            background-color: #2980b9;
        }

        .sidebar p {
            cursor: pointer;
            padding: 8px;
            border-radius: 5px;
        }

        .sidebar p:hover {
            background-color: #34495e;
        }

        /* =========================
           PÄÄSISÄLTÖ
        ========================= */

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
        }

        .main-content h2 {
            margin-top: 0;
        }

        .email-list {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            padding: 10px;
        }

        /* =========================
           VIESTIT
        ========================= */

        .email-item {
            padding: 15px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background 0.2s;
            border-radius: 6px;
        }

        .email-item:last-child {
            border-bottom: none;
        }

        .email-item:hover {
            background-color: #f9f9f9;
        }

        .email-item .sender {
            font-weight: bold;
            color: #333;
        }

        .email-item .subject {
            color: #555;
            margin: 5px 0;
        }

        .email-item .time {
            font-size: 12px;
            color: #999;
        }

        /* Lukematon viesti */

        .unread {
            font-weight: bold;
            background-color: #eef7ff;
            border-left: 4px solid #3498db;
        }

        .unread:hover {
            background-color: #dceeff;
        }

        /* =========================
           KIRJOITA VIESTI
        ========================= */

        .compose-modal {
            display: none;
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 400px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            border: 1px solid #ccc;
            flex-direction: column;
            z-index: 1000;
        }

        .modal-header {
            background-color: #2c3e50;
            color: white;
            padding: 10px;
            border-radius: 8px 8px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header span {
            font-weight: bold;
        }

        .close-btn {
            cursor: pointer;
            font-size: 22px;
        }

        .modal-body {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .modal-body input,
        .modal-body textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .modal-body textarea {
            height: 150px;
            resize: none;
        }

        .modal-body button {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .modal-body button:hover {
            background-color: #27ae60;
        }

        /* =========================
           VIESTIN AVAUS
        ========================= */

        .email-popup-background {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .email-popup {
            background: white;
            width: 550px;
            max-width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .email-popup h2 {
            margin-top: 0;
        }

        .email-popup .email-body {
            margin-top: 20px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

		
		/* Painikkeiden alarivi */

.email-popup-buttons {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-top: 25px;
}

.email-popup-buttons button,
.email-popup-buttons a {
    margin-top: 0;
    padding: 12px 20px;
    border: none;
    border-radius: 6px;
    background: #3498db;
    color: white;
    text-decoration: none;
    font-weight: bold;
    cursor: pointer;
    text-align: center;
}

.email-popup-buttons button:hover,
.email-popup-buttons a:hover {
    background: #2980b9;
}

        /* =========================
           ILMOITUS
        ========================= */

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #2c3e50;
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.25);
            z-index: 3000;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(120%);
            }

            to {
                transform: translateX(0);
            }
        }

        /* =========================
           MOBIILI
        ========================= */

        @media (max-width: 700px) {

            body {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                padding: 10px;
            }

            .sidebar h2 {
                display: inline-block;
                margin-right: 20px;
            }

            .sidebar button {
                width: auto;
                padding: 8px 15px;
            }

            .compose-modal {
                width: calc(100% - 20px);
                right: 10px;
                bottom: 10px;
            }
        }
		
		h1 {
    color: white;     
    margin: 4px;  
    font-size: 26px;  
}
h1 a {
    color: white;
    text-decoration: none;
}

		h4 {
    color: white;     
    margin: 4px;  
    font-size: 18px;  
}
h4 a {
    color: white;
    text-decoration: none;
}

        /* =========================
           KIRJOITUSIKKUNA
        ========================= */

        function toggleCompose(show) {

            const modal =
                document.getElementById("composeModal");

            modal.style.display =
                show ? "flex" : "none";

        }


        /* =========================
           LÄHETÄ SÄHKÖPOSTI
        ========================= */

        function sendEmail() {

            const to =
                document.getElementById("emailTo").value.trim();

            const subject =
                document.getElementById("emailSubject").value.trim();

            const message =
                document.getElementById("emailMessage").value.trim();


            if (!to || !subject || !message) {

                alert("Täytä kaikki kentät!");

                return;
            }


            alert(
                "Viesti lähetetty osoitteeseen:\n" + to
            );


            document.getElementById("emailTo").value = "";

            document.getElementById("emailSubject").value = "";

            document.getElementById("emailMessage").value = "";


            toggleCompose(false);


            /* Automaattinen vastaus */

            setTimeout(() => {

                receiveEmail(
                    to,
                    "Vastaus: " + subject,
                    "Kiitos viestistäsi!\n\n" +
                    "Tämä on automaattinen vastaus."
                );

            }, 4000);

        }


        /* =========================
           VASTAANOTA VIESTI
        ========================= */

        function receiveEmail(sender, subject, body) {

            const mail = {

                sender: sender,

                subject: subject,

                body: body,

                read: false

            };


            emailMessages.unshift(mail);


            const emailList =
                document.getElementById("emailList");


            const div =
                document.createElement("div");


            div.className =
                "email-item unread";


            const now = new Date();


            const time =
                now.toLocaleTimeString(
                    "fi-FI",
                    {
                        hour: "2-digit",
                        minute: "2-digit"
                    }
                );


            div.innerHTML = `

                <div class="sender">
                    ${escapeHTML(sender)}
                </div>

                <div class="subject">
                    ${escapeHTML(subject)}
                </div>

                <div class="time">
                    Tänään, ${time}
                </div>

            `;


            div.onclick = function() {

                openEmail(mail, div);

            };


            emailList.prepend(div);


            inboxCount++;


            document.getElementById(
                "inbox-count"
            ).textContent = inboxCount;


            showNotification(
                "Uusi viesti: " + subject
            );

        }


        /* =========================
           AVAA VIESTI
        ========================= */

        function openEmail(mail, element) {

            /* Merkitään luetuksi */

            mail.read = true;


            if (element) {

                element.classList.remove("unread");

            }


            const background =
                document.createElement("div");


            background.className =
                "email-popup-background";


            const popup =
                document.createElement("div");


            popup.className =
                "email-popup";


popup.innerHTML = `

    <h2>
        ${escapeHTML(mail.subject)}
    </h2>

    <p>
        <b>Lähettäjä:</b>
        ${escapeHTML(mail.sender)}
    </p>

    <hr>

    <div class="email-body">
        ${escapeHTML(mail.body)}
    </div>

    <div class="email-popup-buttons">

        <button id="closeEmailButton">
            ⬅️ Sulje
        </button>

        ${mail.sender === "PekkaAI - BruhGPT" ? `
            <a
                href="BRUHGPT.html"
                target="_blank"
                rel="noopener noreferrer">
                Avaa BruhGPT
            </a>
        ` : ""}

    </div>
`;

popup.querySelector("#closeEmailButton").onclick =
    function() {
        background.remove();
    };

            /* Klikkaamalla taustaa suljetaan */

            background.onclick =
                function(event) {

                    if (event.target === background) {

                        background.remove();

                    }

                };


            background.appendChild(popup);

            document.body.appendChild(background);

        }


        /* =========================
           TURVALLINEN TEKSTI
        ========================= */

        function escapeHTML(text) {

            return text

                .replace(/&/g, "&amp;")

                .replace(/</g, "&lt;")

                .replace(/>/g, "&gt;")

                .replace(/"/g, "&quot;")

                .replace(/'/g, "&#039;");

        }


        /* =========================
           ILMOITUS
        ========================= */

        function showNotification(text) {

            const notification =
                document.createElement("div");


            notification.className =
                "notification";


            notification.textContent =
                "📩 " + text;


            document.body.appendChild(
                notification
            );


            setTimeout(() => {

                notification.remove();

            }, 4000);


            /* Selain ilmoitus */

            if (
                "Notification" in window &&
                Notification.permission === "granted"
            ) {

                new Notification(
                    "Uusi viesti",
                    {
                        body: text
                    }
                );

            }

        }


        /* =========================
           ILMOITUSLUVAN PYYNTÖ
        ========================= */

        if ("Notification" in window) {

            Notification.requestPermission();

        }


        /* =========================
           RANDOM-VIESTIN LUOMINEN
        ========================= */

        function createRandomEmail() {

    // Ei enää viestejä jäljellä
    if (randomEmails.length === 0) {
        return;
    }

    const randomIndex =
        Math.floor(
            Math.random() *
            randomEmails.length
        );

    const mail = randomEmails[randomIndex];

    receiveEmail(
        mail.sender,
        mail.subject,
        mail.body
    );

    // Poistetaan käytetty viesti,
    // jotta sama ei voi tulla uudelleen
    randomEmails.splice(randomIndex, 1);
}

        /* =========================
           SATUNNAINEN AIKA
        ========================= */

        function scheduleRandomEmail() {

            const delay =
                Math.random() * 500 + 100;


            setTimeout(() => {

                createRandomEmail();

                scheduleRandomEmail();

            }, delay);

        }


        /* Käynnistetään random-viestit */

        scheduleRandomEmail();

    </script>
