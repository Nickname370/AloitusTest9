<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAVP - Aloitusnäyttö</title>
    <style>
        /* Klassinen GTA-henkinen tumma ja neonvärinen teema */
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle, #2c3e50, #000000);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Impact', 'Arial Black', sans-serif;
            overflow: hidden;
            color: white;
        }

        /* Taustakollaasi-efekti (GTA-sarjakuvamainen fiilis CSS-muodoilla) */
        .bg-art {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.15;
            pointer-events: none;
            background-image: 
                linear-gradient(45deg, #ff007f 25%, transparent 25%), 
                linear-gradient(-45deg, #ff007f 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #00f0ff 75%), 
                linear-gradient(-45deg, transparent 75%, #00f0ff 75%);
            background-size: 100px 100px;
        }

        /* Valikon pääkontti */
        .menu-container {
            position: relative;
            z-index: 10;
            text-align: center;
            background: rgba(0, 0, 0, 0.65);
            padding: 50px 80px;
            border: 4px solid #fff;
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.5), inset 0 0 20px rgba(0, 240, 255, 0.3);
            border-radius: 10px;
            max-width: 600px;
            width: 90%;
        }

        /* Väärä nimi (GTA) ruksattu yli */
        .wrong-title {
            font-size: 24px;
            color: #888;
            text-decoration: line-through;
            text-decoration-color: #ff0055;
            text-decoration-thickness: 4px;
            margin-bottom: 0px;
            letter-spacing: 2px;
            font-style: italic;
        }

        /* Oikea suomalainen nimi SAVP */
        .logo-title {
            font-size: 65px;
            text-transform: uppercase;
            line-height: 0.95;
            margin: 10px 0 40px 0;
            color: #fff;
            text-shadow: 
                3px 3px 0px #ff0055, 
                -3px -3px 0px #00f0ff,
                5px 5px 15px rgba(0,0,0,1);
            letter-spacing: 3px;
            transform: rotate(-2deg);
        }

        .logo-sub {
            display: block;
            font-size: 20px;
            color: #55ff55;
            text-shadow: 2px 2px 0px #000;
            margin-top: 5px;
            letter-spacing: 1px;
        }

        /* Valikon painikkeet */
        .menu-options {
            display: flex;
            flex-direction: column;
            gap: 18px;
            align-items: center;
        }

        .menu-btn {
            background: linear-gradient(135deg, #111, #222);
            color: #fff;
            border: 2px solid #555;
            padding: 15px 40px;
            font-size: 22px;
            letter-spacing: 2px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s ease-in-out;
            width: 100%;
            max-width: 300px;
            text-decoration: none;
            display: inline-block;
            box-shadow: 3px 3px 0px #000;
        }

        /* Hover-efektit painikkeille */
        .menu-btn:hover {
            background: #fff;
            color: #000;
            border-color: #fff;
            transform: scale(1.05) rotate(1deg);
            box-shadow: -5px 5px 0px #ff0055;
        }

        /* Alalaidan tekstit */
        .copyright {
            margin-top: 40px;
            font-family: sans-serif;
            font-size: 11px;
            color: #666;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="bg-art"></div>

    <div class="menu-container">
        <!-- Vitsikäs otsikkorakenne -->
        <div class="wrong-title">Grand Theft Auto</div>
        <h1 class="logo-title">
            SAVP
            <span class="logo-sub">Suuri Auton Varastus Peli</span>
        </h1>

        <!-- Valikon valinnat -->
        <div class="menu-options">
            <a href="savp.html" class="menu-btn">Aloita Peli</a>
            <button class="menu-btn" onclick="alert('Ohjaus:\n- WASD tai Nuolinäppäimet = Liiku / Aja\n- E = Mene autoon / Poistu autosta\n\nTavoite: Varasta auto ja vältä seiniä!')">Ohjeet</button>
            <a href="valikko3.html" class="menu-btn">Poistu</a>
        </div>

        <div class="copyright">
            SAVP
        </div>
    </div>

</body>
</html>
