function newChat() {
  const messages = document.getElementById("messages");

  messages.innerHTML = "";

  addMessage("Uusi keskustelu aloitettu!", "bot");
}

const keywords = [
    ...new Set(
        [...document.documentElement.innerHTML.matchAll(
            /message\.includes\(["']([^"']+)["']\)/g
        )].map(match => match[1].toLowerCase())
    )
];

const messageInput = document.getElementById("userInput");
const suggestions = document.getElementById("suggestions");

messageInput.addEventListener("input", function () {
    const words = this.value.split(/\s+/);
    const lastWord = words[words.length - 1].toLowerCase();

    suggestions.innerHTML = "";

    if (!lastWord || lastWord === "") {
        return;
    }

const matches = keywords.filter(keyword =>
    keyword.startsWith(lastWord) &&
    keyword !== lastWord
).slice(0, 10);

    matches.forEach(keyword => {
        const button = document.createElement("button");

        button.textContent = "💡 " + keyword;

        button.onclick = function () {
            words[words.length - 1] = keyword;

            messageInput.value = words.join(" ") + " ";

            suggestions.innerHTML = "";

            messageInput.focus();
        };

        suggestions.appendChild(button);
    });
});

function randomQuestion() {
  // Varmistetaan, että avainsanoja on olemassa koodissa
  if (keywords && keywords.length > 0) {
    // Arvotaan satunnainen indeksi taulukosta
    const randomIndex = Math.floor(Math.random() * keywords.length);
    const randomWord = keywords[randomIndex];
    
    // Haetaan tekstikenttä ja asetetaan arvottu sana sinne
    const messageInput = document.getElementById("userInput");
    messageInput.value = randomWord;
    
    // Tyhjennetään mahdolliset vanhat ehdotukset
    document.getElementById("suggestions").innerHTML = "";
    
    // TÄMÄ LÄHETTÄÄ VIESTIN AUTOMAATTISESTI:
    // Jos sivullasi on käytössä sendMessage-funktio, kutsutaan sitä tässä.
    if (typeof sendMessage === "function") {
        sendMessage();
    }
    
  } else {
    console.log("Avainsanoja ei löytynyt taulukosta.");
  }
}
